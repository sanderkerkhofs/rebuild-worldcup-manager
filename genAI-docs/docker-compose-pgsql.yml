services:
  postgres:
    image: postgres:16-alpine
    container_name: rebuild_tournament_manager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament
      POSTGRES_DB: rebuild_tournament_manager
    ports:
      - "5433:5432"
    volumes:
      - rebuild_tournament_manager_pgdata:/var/lib/postgresql/data

volumes:
  rebuild_tournament_manager_pgdata: